<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REP//RANK">
<title>REP//RANK</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
body{
margin:0;
background:#070707;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}
.app{
max-width:520px;
margin:auto;
padding:22px 18px 110px;
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:25px;
font-weight:950;
letter-spacing:-1.5px;
}
.rank{
padding:8px 13px;
border-radius:20px;
font-size:12px;
font-weight:900;
background:#242424;
}
.hero{
margin-top:24px;
padding:24px;
border-radius:25px;
background:linear-gradient(145deg,#191919,#0d0d0d);
border:1px solid #292929;
}
.muted{
color:#888;
font-size:12px;
font-weight:700;
}
.level{
font-size:58px;
font-weight:950;
line-height:1;
margin:5px 0;
}
.xpbar{
height:9px;
background:#292929;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}
.xpfill{
height:100%;
width:0;
background:white;
border-radius:10px;
transition:.3s;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:13px;
}
.card{
background:#121212;
border:1px solid #242424;
border-radius:20px;
padding:18px;
}
.card h3{
margin:0;
color:#777;
font-size:11px;
}
.card p{
margin:7px 0 0;
font-size:27px;
font-weight:900;
}
.section{
margin-top:27px;
}
.section h2{
font-size:20px;
margin:0 0 12px;
}
.exercise{
width:100%;
display:flex;
align-items:center;
justify-content:space-between;
background:#131313;
color:white;
border:1px solid #292929;
border-radius:18px;
padding:17px;
margin-bottom:10px;
text-align:left;
cursor:pointer;
}
.exercise:active,
.mainbtn:active,
.nav button:active{
transform:scale(.97);
}
.exercise strong{
display:block;
font-size:16px;
}
.exercise span{
display:block;
color:#777;
font-size:12px;
margin-top:3px;
}
.mainbtn{
width:100%;
border:0;
border-radius:18px;
padding:17px;
background:white;
color:black;
font-weight:900;
cursor:pointer;
margin-top:10px;
}
.screen{
display:none;
}
.screen.active{
display:block;
}
.back{
background:none;
border:0;
color:#aaa;
padding:0 0 18px;
font-weight:700;
cursor:pointer;
}
.camera{
position:relative;
width:100%;
height:500px;
background:#000;
border-radius:24px;
overflow:hidden;
border:1px solid #292929;
}
#video{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
}
#poseCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
transform:scaleX(-1);
}
.cameraUI{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
z-index:5;
}
.status{
padding:9px 12px;
background:rgba(0,0,0,.7);
border-radius:15px;
font-size:12px;
font-weight:800;
}
.repUI{
position:absolute;
bottom:15px;
left:15px;
right:15px;
background:rgba(0,0,0,.75);
border-radius:18px;
padding:14px;
z-index:5;
}
.repNumber{
font-size:42px;
font-weight:950;
}
.form{
font-size:13px;
font-weight:800;
margin-top:4px;
}
.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:rgba(9,9,9,.95);
backdrop-filter:blur(18px);
border-top:1px solid #222;
display:flex;
justify-content:space-around;
padding:10px 0 calc(10px + env(safe-area-inset-bottom));
z-index:20;
}
.nav button{
background:none;
border:0;
color:#666;
font-size:10px;
font-weight:700;
cursor:pointer;
}
.nav button.active{
color:white;
}
.navicon{
display:block;
font-size:21px;
margin-bottom:2px;
}
.bodybox{
height:390px;
background:#111;
border:1px solid #252525;
border-radius:24px;
position:relative;
overflow:hidden;
display:flex;
justify-content:center;
}
.body{
position:relative;
width:230px;
height:370px;
margin-top:10px;
}
.head{
position:absolute;
width:58px;
height:68px;
border-radius:50%;
background:#bdbdbd;
left:86px;
top:5px;
}
.neck{
position:absolute;
width:34px;
height:35px;
background:#a8a8a8;
left:98px;
top:55px;
border-radius:8px;
}
.part{
position:absolute;
background:#777;
border-radius:30px;
}
.shoulder1{
width:58px;
height:43px;
top:78px;
left:28px;
transform:rotate(-18deg);
}
.shoulder2{
width:58px;
height:43px;
top:78px;
right:28px;
transform:rotate(18deg);
}
.chest1{
width:66px;
height:58px;
top:92px;
left:48px;
border-radius:45%;
}
.chest2{
width:66px;
height:58px;
top:92px;
right:48px;
border-radius:45%;
}
.arm1{
width:37px;
height:82px;
top:112px;
left:16px;
transform:rotate(10deg);
}
.arm2{
width:37px;
height:82px;
top:112px;
right:16px;
transform:rotate(-10deg);
}
.core{
width:78px;
height:115px;
left:76px;
top:147px;
background:#686868;
border-radius:18px;
}
.leg1{
width:62px;
height:125px;
top:255px;
left:52px;
border-radius:28px;
}
.leg2{
width:62px;
height:125px;
top:255px;
right:52px;
border-radius:28px;
}
</style>
</head>
<body>
<div class="app">
<div id="home" class="screen active">
<div class="top">
<div class="logo">REP//RANK</div>
<div class="rank">ROOKIE I</div>
</div>
<div class="hero">
<div class="muted">CURRENT LEVEL</div>
<div class="level" id="level">1</div>
<div class="muted">
<span id="xp">0</span> / 100 XP
</div>
<div class="xpbar">
<div id="xpfill" class="xpfill"></div>
</div>
</div>
<div class="grid">
<div class="card">
<h3>TOTAL REPS</h3>
<p id="totalReps">0</p>
</div>
<div class="card">
<h3>🔥 STREAK</h3>
<p>0</p>
</div>
</div>
<div class="section">
<h2>Train</h2>
<button class="exercise" onclick="openWorkout('Push-ups')">
<div>
<strong>Push-ups</strong>
<span>Chest • Triceps • Shoulders</span>
</div>
<strong>›</strong>
</button>
<button class="exercise" onclick="openWorkout('Squats')">
<div>
<strong>Squats</strong>
<span>Quads • Glutes • Core</span>
</div>
<strong>›</strong>
</button>
<button class="exercise" onclick="openWorkout('Plank')">
<div>
<strong>Plank</strong>
<span>Core • Shoulders</span>
</div>
<strong>›</strong>
</button>
</div>
<div class="section">
<h2>Body</h2>
<div class="bodybox">
<div class="body">
<div class="head"></div>
<div class="neck"></div>
<div class="part shoulder1"></div>
<div class="part shoulder2"></div>
<div class="part chest1"></div>
<div class="part chest2"></div>
<div class="part arm1"></div>
<div class="part arm2"></div>
<div class="part core"></div>
<div class="part leg1"></div>
<div class="part leg2"></div>
</div>
</div>
</div>
</div>
<div id="workout" class="screen">
<button class="back" onclick="show('home')">‹ Back</button>
<h1>Push-ups</h1>
<div class="camera">
<video id="video" autoplay playsinline muted></video>
<canvas id="poseCanvas"></canvas>
<div class="cameraUI">
<div class="status" id="status">CAMERA OFF</div>
<div class="status">REP <span id="cameraReps">0</span></div>
</div>
<div class="repUI">
<div class="repNumber" id="sessionReps">0</div>
<div class="form" id="formStatus">
Start the camera to begin
</div>
</div>
</div>
<button class="mainbtn" onclick="startPoseCamera()">
START CAMERA
</button>
<button class="mainbtn" onclick="manualRep()">
+ ADD REP
</button>
</div>
<div id="progress" class="screen">
<h1>Progress</h1>
<div class="card">
<h3>TOTAL REPS</h3>
<p id="progressReps">0</p>
</div>
<div class="section">
<h2>Level</h2>
<div class="card">
<p id="progressRank">ROOKIE I</p>
</div>
</div>
</div>
<div id="profile" class="screen">
<h1>Profile</h1>
<div class="card">
<h3>RANK</h3>
<p id="profileRank">ROOKIE I</p>
</div>
</div>
</div>
<div class="nav">
<button id="navHome" class="active" onclick="show('home')">
<span class="navicon">⌂</span>
Home
</button>
<button id="navWorkout" onclick="show('workout')">
<span class="navicon">🏋️</span>
Workout
</button>
<button id="navProgress" onclick="show('progress')">
<span class="navicon">↗</span>
Progress
</button>
<button id="navProfile" onclick="show('profile')">
<span class="navicon">●</span>
Profile
</button>
</div>
<script>
let data=JSON.parse(localStorage.getItem("reprank"))||{
reps:0,
xp:0,
level:1
};
let sessionReps=0;
function save(){
localStorage.setItem("reprank",JSON.stringify(data));
update();
}
function update(){
document.getElementById("totalReps").textContent=data.reps;
document.getElementById("progressReps").textContent=data.reps;
document.getElementById("level").textContent=data.level;
document.getElementById("xp").textContent=data.xp;
document.getElementById("xpfill").style.width=data.xp+"%";
let ranks=[
"ROOKIE I",
"ROOKIE II",
"GRINDER",
"ATHLETE",
"BEAST",
"ELITE",
"GOAT"
];
let rank=ranks[Math.min(Math.floor(data.level/3),ranks.length-1)];
document.querySelector(".rank").textContent=rank;
document.getElementById("progressRank").textContent=rank;
document.getElementById("profileRank").textContent=rank;
}
function gainXP(amount){
data.xp+=amount;
while(data.xp>=100){
data.xp-=100;
data.level++;
}
}
function manualRep(){
sessionReps++;
data.reps++;
gainXP(5);
document.getElementById("sessionReps").textContent=sessionReps;
document.getElementById("cameraReps").textContent=sessionReps;
document.getElementById("formStatus").textContent="Rep counted ✓";
save();
}
function show(id){
document.querySelectorAll(".screen").forEach(x=>{
x.classList.remove("active");
});
document.getElementById(id).classList.add("active");
document.querySelectorAll(".nav button").forEach(x=>{
x.classList.remove("active");
});
let nav={
home:"navHome",
workout:"navWorkout",
progress:"navProgress",
profile:"navProfile"
};
document.getElementById(nav[id]).classList.add("active");
}
function openWorkout(name){
show("workout");
}
let pose;
let cameraStream;
async function startPoseCamera(){
const video=document.getElementById("video");
const canvas=document.getElementById("poseCanvas");
const ctx=canvas.getContext("2d");
document.getElementById("status").textContent="STARTING...";
try{
cameraStream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:720},
height:{ideal:720}
},
audio:false
});
video.srcObject=cameraStream;
await video.play();
pose=new Pose({
locateFile:(file)=>{
return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
}
});
pose.setOptions({
modelComplexity:1,
smoothLandmarks:true,
enableSegmentation:false,
minDetectionConfidence:.5,
minTrackingConfidence:.5
});
pose.onResults(results=>{
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
ctx.clearRect(0,0,canvas.width,canvas.height);
if(!results.poseLandmarks){
document.getElementById("status").textContent="NO BODY DETECTED";
return;
}
document.getElementById("status").textContent="BODY DETECTED";
drawSkeleton(ctx,results.poseLandmarks,canvas.width,canvas.height);
});
document.getElementById("formStatus").textContent=
"Get into push-up position";
async function loop(){
if(video.readyState>=2){
await pose.send({image:video});
}
requestAnimationFrame(loop);
}
loop();
}catch(e){
document.getElementById("status").textContent="CAMERA ERROR";
document.getElementById("formStatus").textContent=
"Allow camera access in Safari settings.";
}
}
function drawSkeleton(ctx,landmarks,w,h){
const connections=[
[11,13],[13,15],
[12,14],[14,16],
[11,12],
[11,23],[12,24],
[23,24],
[23,25],[25,27],
[24,26],[26,28],
[27,31],[28,32]
];
ctx.lineWidth=4;
ctx.strokeStyle="#ffffff";
connections.forEach(pair=>{
const a=landmarks[pair[0]];
const b=landmarks[pair[1]];
if(a.visibility>.5 && b.visibility>.5){
ctx.beginPath();
ctx.moveTo(a.x*w,a.y*h);
ctx.lineTo(b.x*w,b.y*h);
ctx.stroke();
}
});
landmarks.forEach(point=>{
if(point.visibility>.5){
ctx.beginPath();
ctx.arc(point.x*w,point.y*h,6,0,Math.PI*2);
ctx.fillStyle="#ffffff";
ctx.fill();
}
});
}
update();
</script>
</body>
</html>
